<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PileSpin — steam roulette: pick a random game</title>
  <meta name="description" content="PileSpin — load your Steam library or wishlist, spin the wheel and let it decide what to play. Live Steam prices and discounts, shareable links. Free, no sign-up. Есть русская версия." />
  <link rel="canonical" href="https://dvinerlove.github.io/steam-roulette/landing.html" />
  <link rel="alternate" hreflang="en" href="https://dvinerlove.github.io/steam-roulette/landing.html" />
  <link rel="alternate" hreflang="ru" href="https://dvinerlove.github.io/steam-roulette/landing-ru.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PileSpin" />
  <meta property="og:title" content="PileSpin — steam roulette: pick a random game" />
  <meta property="og:description" content="Load your games, spin the wheel, get a random pick with live Steam prices and discounts. Free, no sign-up." />
  <meta property="og:url" content="https://dvinerlove.github.io/steam-roulette/landing.html" />
  <meta property="og:image" content="https://dvinerlove.github.io/steam-roulette/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PileSpin — steam roulette: pick a random game" />
  <meta name="twitter:description" content="Spin the wheel over your game list. Live Steam prices, custom themes, shareable links." />
  <meta name="twitter:image" content="https://dvinerlove.github.io/steam-roulette/og-image.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "PileSpin",
    "url": "https://dvinerlove.github.io/steam-roulette/",
    "description": "Free web app that picks a random game from your list — spin the wheel with live Steam prices and discounts, shareable links, custom themes.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "screenshot": "https://dvinerlove.github.io/steam-roulette/og-image.png",
    "inLanguage": ["en", "ru"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "dvinerlove", "url": "https://github.com/dvinerlove" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "Is PileSpin free?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. Completely free, no sign-up, no ads. The source code is open on GitHub under the MIT license." } },
      { "@type": "Question", "name": "How does PileSpin pick a winner?",
        "acceptedAnswer": { "@type": "Answer", "text": "Every game on the wheel gets an equal sector and an equal 1-in-N chance. The winner is chosen by a cryptographic random generator (crypto.getRandomValues) — no weighting, no tricks." } },
      { "@type": "Question", "name": "Does it work with Steam?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. Games are auto-matched to Steam entries, so you see live regional prices, discounts and game covers right on the wheel." } },
      { "@type": "Question", "name": "Where is my game list stored?",
        "acceptedAnswer": { "@type": "Answer", "text": "Only in your browser's local storage — nothing is sent anywhere. Sharing works through a short link that encodes your list and settings." } },
      { "@type": "Question", "name": "Is there a Russian version?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes, the interface is available in English and Russian — it's auto-detected from your browser language and can be switched in settings." } }
    ]
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 0;
    }
    .logo { font-weight: 800; font-size: 20px; }
    .logo span { color: #818cf8; }
    nav a { color: #94a3b8; text-decoration: none; margin-left: 24px; font-size: 15px; }
    nav a:hover { color: #fff; }
    nav a.lang { opacity: .55; }
    nav a.lang.active { color: #fff; opacity: 1; text-decoration: underline; }
    .hero { text-align: center; padding: 64px 0 48px; }
    .hero h1 {
      font-size: clamp(36px, 7vw, 72px); font-weight: 900; line-height: 1.1;
      color: #f8fafc;
    }
    .hero p { margin: 20px auto 0; max-width: 620px; color: #cbd5e1; font-size: clamp(16px, 2.5vw, 20px); }
    .cta {
      display: inline-block; margin-top: 36px; padding: 18px 48px;
      background: #4f46e5; color: #fff; font-size: 20px; font-weight: 700;
      border-radius: 14px; text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      transition: transform .15s, background .15s;
    }
    .cta:hover { background: #6366f1; transform: translateY(-2px); }
    .shot {
      margin: 56px auto 0; max-width: 900px; border-radius: 16px; overflow: hidden;
      border: 1px solid #334155; box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
    .shot img { display: block; width: 100%; }
    .features {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px; padding: 72px 0;
    }
    .card {
      background: rgba(30, 41, 59, .7); border: 1px solid #334155;
      border-radius: 14px; padding: 24px;
    }
    .card h3 { font-size: 17px; margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 14px; line-height: 1.55; }
    footer {
      border-top: 1px solid #1e293b; padding: 32px 0; text-align: center;
      color: #64748b; font-size: 14px;
    }
    footer a { color: #818cf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <div class="logo" data-i="logo">Steam<span>Roulette</span></div>
      <div>
        <a class="lang" href="?lang=en" data-lang="en">EN</a><a class="lang" href="?lang=ru" data-lang="ru">RU</a>
        <a href="./" data-i="navApp">Open app</a>
        <a href="https://github.com/dvinerlove/steam-roulette" rel="noopener">GitHub</a>
      </div>
    </nav>

    <section class="hero">
      <h1 data-i="h1">Let the wheel decide<br>what to play</h1>
      <p data-i="sub">Load your game list, spin the wheel and get a random pick with live Steam prices and discounts. Share your wheel with friends via a single link.</p>
      <a class="cta" href="./" data-i="cta">Spin the wheel →</a>
      <div class="shot"><img src="og-image.png" alt="PileSpin — steam roulette app screenshot" /></div>
    </section>

    <section class="features" id="features"></section>

    <section class="wrap" style="max-width:760px;margin:0 auto;padding-bottom:64px">
      <h2 data-i="faqTitle" style="font-size:28px;font-weight:800;margin-bottom:20px"></h2>
      <div id="faq"></div>
    </section>

    <footer data-i="footer">
      <a href="https://github.com/dvinerlove/steam-roulette" rel="noopener">Source on GitHub</a> · <a href="steam-roulette.html">Steam Roulette</a>
    </footer>
  </div>

  <script>
    const S = {
      en: {
        logo: 'Steam<span>Roulette</span>',
        navApp: 'Open app',
        h1: 'Let the wheel decide<br>what to play',
        sub: 'Load your game list, spin the wheel and get a random pick with live Steam prices and discounts. Share your wheel with friends via a single link.',
        cta: 'Spin the wheel →',
        footer: '<a href="https://github.com/dvinerlove/steam-roulette" rel="noopener">Source on GitHub</a> · <a href="steam-roulette.html">Steam Roulette</a>',
        cards: [
          ['Random pick', 'Fair cryptographic randomness with a smooth decelerating spin animation.'],
          ['Steam prices', 'Automatic Steam lookup shows live price and discount — right on the wheel and in the result.'],
          ['Link sharing', 'A short link saves your game list and all theme settings — send it to friends.'],
          ['Full customization', 'Your own background, sector colors, game covers, button text, spin speed and sound.'],
          ['Spin history', 'Every winning game is saved — nothing gets lost between sessions.'],
          ['No sign-up', 'Open and spin. Everything runs in your browser, data stays local.'],
        ],
        title: 'PileSpin — steam roulette: pick a random game',
        faqTitle: 'FAQ',
        faq: [
          ['Is PileSpin free?', 'Yes. Completely free, no sign-up, no ads. The source code is open on GitHub under the MIT license.'],
          ['How does the wheel pick a winner?', 'Every game gets an equal sector and an equal 1-in-N chance. The winner comes from a cryptographic random generator (crypto.getRandomValues) — no weighting, no tricks.'],
          ['Does it work with Steam?', 'Yes. Games auto-match to Steam entries: live regional prices, discounts and covers right on the wheel.'],
          ['Where is my game list stored?', 'Only in your browser\'s local storage — nothing is sent anywhere. Sharing works through a short link that encodes your list and settings.'],
          ['Is there a Russian version?', 'Yes — English and Russian UI, auto-detected from browser language, switchable in settings.'],
        ],
      },
      ru: {
        logo: 'Steam<span>Roulette</span>',
        navApp: 'Приложение',
        h1: 'Пусть колесо решит,<br>во что играть',
        sub: 'Загрузите список игр, крутите колесо и получайте случайный выбор с живыми ценами и скидками Steam. Делитесь своим колесом с друзьями одной ссылкой.',
        cta: 'Крутить колесо →',
        footer: '<a href="https://github.com/dvinerlove/steam-roulette" rel="noopener">Исходный код на GitHub</a> · <a href="steam-roulette.html">Steam Roulette</a>',
        cards: [
          ['Случайный выбор', 'Честная криптографическая рандомизация и плавная анимация прокрутки с затуханием.'],
          ['Цены Steam', 'Автоматический поиск игры в Steam, актуальная цена и размер скидки — прямо на колесе и в результате.'],
          ['Шаринг ссылкой', 'Короткая ссылка сохраняет ваш список игр и все настройки оформления — отправьте друзьям.'],
          ['Полная кастомизация', 'Свой фон, цвета секторов, обложки игр, текст кнопки, скорость вращения и звук.'],
          ['История прокрутов', 'Все выпавшие игры сохраняются — ничего не потеряется между сессиями.'],
          ['Без регистрации', 'Открыли — крутите. Всё работает в браузере, данные хранятся локально.'],
        ],
        title: 'Steam-рулетка — случайный выбор игры',
        faqTitle: 'Частые вопросы',
        faq: [
          ['PileSpin бесплатный?', 'Да. Полностью бесплатно, без регистрации и рекламы. Исходный код открыт на GitHub под лицензией MIT.'],
          ['Как колесо выбирает победителя?', 'У каждой игры равный сектор и шанс 1/N. Победителя выбирает криптографический генератор случайных чисел — без весов и подвоха.'],
          ['Работает ли это со Steam?', 'Да. Игры автоматически связываются со Steam: живые региональные цены, скидки и обложки прямо на колесе.'],
          ['Где хранится мой список игр?', 'Только в локальном хранилище вашего браузера — никуда не отправляется. Для шаринга используется короткая ссылка с вашим списком и настройками.'],
          ['Есть ли английская версия?', 'Да — интерфейс на русском и английском, определяется по языку браузера, переключается в настройках.'],
        ],
      },
    };
    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en');
    const s = S[lang] || S.en;
    document.documentElement.lang = lang;
    document.title = s.title;
    document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = s[el.dataset.i]; });
    document.getElementById('features').innerHTML = s.cards
      .map(([h, p]) => `<div class="card"><h3>${h}</h3><p>${p}</p></div>`).join('');
    document.getElementById('faq').innerHTML = s.faq
      .map(([q, a]) => `<div class="card" style="margin-bottom:12px"><h3>${q}</h3><p>${a}</p></div>`).join('');
    document.querySelectorAll('a.lang').forEach(a => a.classList.toggle('active', a.dataset.lang === lang));
  </script>
</body>
</html>
